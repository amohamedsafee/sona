<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sona Luxury Hotel | Sign In</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Lora:400,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Cabin:400,500,600,700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="../css/font-awesome.min.css" type="text/css">
  
  <!-- Admin Styles -->
  <link rel="stylesheet" href="css/admin-style.css" type="text/css">

  <style>
    body.login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(rgba(17, 17, 17, 0.85), rgba(17, 17, 17, 0.88)), url('../img/hero/hero-1.jpg') no-repeat center center / cover;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: #19191a;
      border: 1px solid rgba(223, 169, 116, 0.3);
      border-radius: var(--radius-md);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      padding: 40px;
      position: relative;
      overflow: hidden;
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #dfa974, #f7e8da, #dfa974);
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header img {
      max-height: 44px;
      margin-bottom: 12px;
    }

    .login-header h2 {
      color: #ffffff;
      font-size: 24px;
      margin-bottom: 6px;
    }

    .login-header p {
      color: #999;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .login-form .form-group {
      margin-bottom: 20px;
    }

    .login-form label {
      color: #c7c7c7;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .input-icon-wrap {
      position: relative;
    }

    .input-icon-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary-gold);
    }

    .input-icon-wrap input {
      background: #252528;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 12px 14px 12px 42px;
      border-radius: var(--radius-sm);
      width: 100%;
      font-size: 14px;
      transition: var(--transition);
    }

    .input-icon-wrap input:focus {
      border-color: var(--primary-gold);
      background: #2c2c30;
      box-shadow: 0 0 0 3px var(--primary-gold-glow);
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: var(--primary-gold);
      color: #111;
      font-family: 'Cabin', sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      margin-top: 10px;
      transition: var(--transition);
    }

    .btn-login:hover {
      background: var(--primary-gold-dark);
      color: #fff;
      box-shadow: 0 4px 16px var(--primary-gold-glow);
    }
    .login-footer-links {
      text-align: center;
      margin-top: 24px;
    }

    .login-footer-links a {
      color: #888;
      font-size: 13px;
    }

    .login-footer-links a:hover {
      color: var(--primary-gold);
    }
  </style>
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-header">
      <img src="../img/logo.png" alt="Sona Hotel">
      <h2>Staff Sign In</h2>
      <p>Luxury Hotel & Resort Administration</p>
    </div>

    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="usernameOrEmail">Email or Username</label>
        <div class="input-icon-wrap">
          <i class="fa fa-user"></i>
          <input type="text" id="usernameOrEmail" placeholder="admin@sona.com" required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-icon-wrap">
          <i class="fa fa-lock"></i>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-login">
        <i class="fa fa-sign-in"></i> Secure Sign In
      </button>



      <div class="login-footer-links">
        <a href="../index.html"><i class="fa fa-arrow-left"></i> Return to Public Website</a>
      </div>
    </form>
  </div>

  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/admin-api.js"></script>
  <script>
    // Form submission
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const usernameOrEmail = document.getElementById('usernameOrEmail').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!usernameOrEmail || !password) {
        SonaAPI.showToast('Please enter both email/username and password.', 'warning');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Authenticating...';

      try {
        const response = await SonaAPI.auth.login(usernameOrEmail, password);
        if (response.success && response.token) {
          SonaAPI.setToken(response.token);
          SonaAPI.setUser(response.user);
          SonaAPI.showToast('Welcome back, ' + response.user.full_name, 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 600);
        } else {
          SonaAPI.showToast(response.message || 'Login failed', 'error');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa fa-sign-in"></i> Secure Sign In';
        }
      } catch (err) {
        SonaAPI.showToast(err.message || 'Authentication error', 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa fa-sign-in"></i> Secure Sign In';
      }
    });
  </script>
</body>
</html>
